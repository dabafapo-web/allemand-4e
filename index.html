<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Schule – Wo oder wohin?</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#14243a;background:#eef3f8}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:700px;margin:auto}.panel{background:white;border-radius:18px;padding:25px;box-shadow:0 5px 24px #13284017}h1{margin:0 0 6px;color:#173f70}h2{line-height:1.4}small{color:#5d6c80}.tag{display:inline-block;background:#dfeaf7;border-radius:30px;padding:5px 12px;font-weight:700}button{cursor:pointer;border:0;border-radius:12px;padding:14px 17px;font-size:1rem}button:focus-visible{outline:3px solid #faad34}.option{display:block;width:100%;text-align:left;background:#edf3fa;margin:10px 0;border:2px solid transparent}.option:hover{background:#dce9fa}.option:disabled{cursor:default}.correct{border-color:#19845a;background:#dcf7e8}.wrong{border-color:#bc4650;background:#fde6e6}.primary{background:#1d5e9b;color:white;font-weight:700}.secondary{background:#e3ebf3;color:#193b5e}#feedback{padding:15px;border-radius:12px;background:#f1f6fa;margin-top:14px}#hint{padding:12px;background:#fff5da;border-radius:12px;margin:12px 0}#progress{height:8px;background:#dae5f0;border-radius:8px;margin:15px 0}#bar{height:100%;background:#2679bd;border-radius:8px;width:0}footer{color:#5b6979;font-size:.85rem;margin-top:14px}#controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}</style></head><body><main><div class="panel"><h1>Mission Schule</h1><p>Wo oder wohin? · 4e · entraînement autonome</p><div id="app"></div></div><footer>Sans compte, sans collecte de données, sans chronomètre. Fonctionne hors ligne une fois téléchargé.</footer></main><script>const QUESTIONS=[["Wo oder wohin?","Ich lerne in der Bibliothek.","Wo?","Wohin?","Woher?","Wann?",0,"L’élève est déjà dans la bibliothèque.","Wo ? On indique où se déroule l’activité."],["Wo oder wohin?","Ich gehe in die Bibliothek.","Wo?","Wann?","Wohin?","Wer?",2,"On se dirige vers une pièce.","Wohin ? On indique la destination."],["Choisis la bonne forme.","Wir spielen ___ Sporthalle Basketball.","in die","in der","ins","im",1,"On joue déjà dans la salle de sport. Sporthalle est féminin.","Wo ? → in der Sporthalle."],["Choisis la bonne forme.","Wir gehen ___ Sporthalle.","in der","im","in die","ins",2,"On entre dans la salle de sport.","Wohin ? → in die Sporthalle."],["Choisis la bonne forme.","Ich mache Mathe ___ Klassenzimmer.","ins","im","in den","in die",1,"Klassenzimmer est neutre. On est déjà dans la salle.","Wo ? → im Klassenzimmer (in dem)."],["Choisis la bonne forme.","Ich gehe ___ Klassenzimmer.","im","in der","in den","ins",3,"On entre dans la salle de classe.","Wohin ? → ins Klassenzimmer (in das)."],["Wo oder wohin?","Wir essen in der Mensa.","Wohin?","Wo?","Woher?","Wie?",1,"Les élèves sont déjà à la cantine.","Wo ? → in der Mensa."],["Choisis la bonne forme.","Nach dem Unterricht gehen wir ___ Mensa.","in der","im","in die","ins",2,"Mensa est féminin ; les élèves y vont.","Wohin ? → in die Mensa."],["Choisis la bonne forme.","Die Lehrerin arbeitet ___ Lehrerzimmer.","im","ins","in der","in die",0,"Lehrerzimmer est neutre ; elle y travaille.","Wo ? → im Lehrerzimmer."],["Choisis la bonne forme.","Die Lehrerin geht ___ Lehrerzimmer.","im","in der","ins","in die",2,"Elle entre dans cette pièce neutre.","Wohin ? → ins Lehrerzimmer."],["Choisis la bonne forme.","Wir lesen Bücher ___ Bibliothek.","in die","ins","im","in der",3,"Lire est une activité qui se déroule sur place.","Wo ? → in der Bibliothek."],["Choisis la bonne forme.","In der Pause gehe ich ___ Bibliothek.","in der","in die","im","ins",1,"Tu te rends dans cette pièce féminine.","Wohin ? → in die Bibliothek."],["Choisis la bonne forme.","Wir machen Experimente ___ Chemieraum.","im","ins","in die","in der",0,"Chemieraum est masculin ; on y fait déjà une activité.","Wo ? → im Chemieraum (in dem)."],["Choisis la bonne forme.","Die Klasse geht ___ Chemieraum.","im","in die","ins","in den",3,"Chemieraum est masculin ; la classe entre dans cette pièce.","Wohin ? → in den Chemieraum."],["Choisis la bonne forme.","Die Schüler singen ___ Musikraum.","in den","im","ins","in die",1,"Musikraum est masculin ; les élèves y chantent.","Wo ? → im Musikraum."],["Choisis la bonne forme.","Die Schüler gehen ___ Musikraum.","im","ins","in der","in den",3,"Musikraum est masculin ; ils y entrent.","Wohin ? → in den Musikraum."],["Choisis la bonne forme.","Wir machen Sport ___ Sporthalle.","in die","im","in der","ins",2,"On pratique une activité dans cette salle féminine.","Wo ? → in der Sporthalle."],["Choisis la bonne forme.","Nach der Pause gehen wir ___ Klassenzimmer.","im","in den","ins","in der",2,"On retourne dans la salle de classe.","Wohin ? → ins Klassenzimmer."],["Choisis la bonne forme.","In der Pause bin ich ___ Mensa.","in die","in der","im","ins",1,"Mensa est féminin ; on y est déjà.","Wo ? → in der Mensa."],["Choisis la bonne forme.","Für den Musikunterricht gehen wir ___ Musikraum.","im","in die","in den","ins",2,"On se dirige vers une salle masculine.","Wohin ? → in den Musikraum."]];let order=[],idx=0,score=0,locked=false;const app=document.getElementById('app');function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function start(){order=QUESTIONS.map((_,i)=>i);idx=0;score=0;show()}function show(){locked=false;const q=QUESTIONS[order[idx]];app.innerHTML=`<div class="tag">Question ${idx+1} / ${order.length}</div><div id="progress"><div id="bar" style="width:${100*idx/order.length}%"></div></div><small>${esc(q[0])}</small><h2>${esc(q[1])}</h2><div id="choices">${q.slice(2,6).map((a,i)=>`<button class="option" data-i="${i}">${esc(a)}</button>`).join('')}</div><div id="controls"><button class="secondary" id="hintButton">Voir un indice</button></div><div id="hint" hidden>${esc(q[7])}</div><div id="feedback" hidden></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));document.getElementById('hintButton').onclick=()=>document.getElementById('hint').hidden=false}function answer(i){if(locked)return;locked=true;const q=QUESTIONS[order[idx]];const good=q[6];if(i===good)score++;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.getElementById('feedback');f.hidden=false;f.innerHTML=`<strong>${i===good?'Bravo !':'À revoir'}</strong><p>${esc(q[8])}</p>`;document.getElementById('controls').innerHTML='<button class="primary" id="next">'+(idx+1===order.length?'Voir mon résultat':'Question suivante →')+'</button>';document.getElementById('next').onclick=()=>{idx++;if(idx===order.length)finish();else show()}}function finish(){app.innerHTML=`<h2>Mission terminée !</h2><p style="font-size:2rem;font-weight:800">${score} / ${order.length}</p><p>${score>=17?'Très bien !':score>=12?'Bon travail. Revois les explications pour progresser.':'Tu peux recommencer : les corrections sont là pour t’aider.'}</p><button class="primary" onclick="start()">Recommencer</button>`}app.innerHTML='<p>20 questions sur les <b>activités dans les salles de l’école</b> et les <b>déplacements vers ces salles</b> : wo ou wohin ? Lis la correction après chaque réponse.</p><button class="primary" onclick="start()">Commencer le quiz</button>';</script></body></html>
